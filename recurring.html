<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlatSplit - Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="logo">🏠 Flat<span>Split</span></div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="./dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li class="nav-item"><a href="./shared-expenses.html" class="nav-link"><i data-lucide="receipt"></i> Shared Expenses</a></li>
            <li class="nav-item"><a href="./personal-expenses.html" class="nav-link"><i data-lucide="wallet"></i> My Expenses</a></li>
            <li class="nav-item"><a href="./balance.html" class="nav-link"><i data-lucide="scale"></i> Balance</a></li>
            <li class="nav-item"><a href="./analytics.html" class="nav-link"><i data-lucide="bar-chart-3"></i> Analytics</a></li>
            <li class="nav-item"><a href="./recurring.html" class="nav-link"><i data-lucide="repeat"></i> Recurring</a></li>
            <li class="nav-item"><a href="./reports.html" class="nav-link"><i data-lucide="download"></i> Reports</a></li>
            <li class="nav-item"><a href="./settings.html" class="nav-link active"><i data-lucide="settings"></i> Settings</a></li>
        </ul>
        <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <button onclick="logout()" class="nav-link" style="width:100%; background:none; border:none; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; gap:12px;"><i data-lucide="log-out"></i> Switch User</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="mobile-header" style="justify-content: space-between; margin-bottom: 24px;">
            <div class="logo" style="font-size: 20px;">🏠 Flat<span>Split</span></div>
            <button onclick="toggleSidebar()" style="background:none; border:none; font-size: 24px; cursor:pointer;">☰</button>
        </div>

        <header class="header"><h1>Settings</h1></header>

        <div class="card" style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 16px;">Flat Details</h3>
            <div class="grid grid-2">
                <div class="form-group">
                    <label class="form-label">Flat Name</label>
                    <input type="text" class="form-input" id="set-flatname" placeholder="e.g. Apt 404">
                </div>
                <div class="form-group">
                    <label class="form-label">Currency Symbol</label>
                    <input type="text" class="form-input" id="set-currency" maxlength="3" placeholder="₹">
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 16px;">Roommates</h3>
            <div class="grid grid-2">
                <div class="form-group">
                    <label class="form-label">Person 1 Name</label>
                    <input type="text" class="form-input" id="set-user1" placeholder="John">
                </div>
                <div class="form-group">
                    <label class="form-label">Person 2 Name</label>
                    <input type="text" class="form-input" id="set-user2" placeholder="Jane">
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 16px;">Appearance</h3>
            <div class="form-group">
                <label class="form-label">Theme</label>
                <select class="form-input" id="set-theme" onchange="handleThemeChange(this.value)" style="max-width: 300px;">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 16px;">Data & Connection</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
                <div>
                    <div style="font-weight: 600;">Google Sheets Status</div>
                    <div style="font-size: 14px; color: var(--text-secondary);" id="sync-status">Checking...</div>
                </div>
                <button class="btn btn-outline btn-sm" onclick="testConnection()">Test Connection</button>
            </div>
            <button class="btn btn-danger" onclick="if(confirm('Clear all local app data?')) { localStorage.clear(); location.reload(); }">Clear Local Cache</button>
        </div>

        <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
    </main>

    <div id="toast-container"></div>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/recurring.js"></script>
</body>
</html>
