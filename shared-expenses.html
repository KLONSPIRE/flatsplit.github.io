<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlatSplit - Shared Expenses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="logo">🏠 Flat<span>Split</span></div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="./dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li class="nav-item"><a href="./shared-expenses.html" class="nav-link active"><i data-lucide="receipt"></i> Shared Expenses</a></li>
            <li class="nav-item"><a href="./personal-expenses.html" class="nav-link"><i data-lucide="wallet"></i> My Expenses</a></li>
            <li class="nav-item"><a href="./balance.html" class="nav-link"><i data-lucide="scale"></i> Balance</a></li>
            <li class="nav-item"><a href="./analytics.html" class="nav-link"><i data-lucide="bar-chart-3"></i> Analytics</a></li>
            <li class="nav-item"><a href="./recurring.html" class="nav-link"><i data-lucide="repeat"></i> Recurring</a></li>
            <li class="nav-item"><a href="./reports.html" class="nav-link"><i data-lucide="download"></i> Reports</a></li>
            <li class="nav-item"><a href="./settings.html" class="nav-link"><i data-lucide="settings"></i> Settings</a></li>
        </ul>
        <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <button onclick="logout()" class="nav-link" style="width:100%; background:none; border:none; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; gap:12px;"><i data-lucide="log-out"></i> Switch User</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="mobile-header" style="justify-content: space-between; margin-bottom: 24px;">
            <div class="logo" style="font-size: 20px;">🏠 Flat<span>Split</span></div>
            <button onclick="toggleSidebar()" style="background:none; border:none; font-size: 24px; cursor:pointer;">☰</button>
        </div>

        <header class="header">
            <h1>Shared Expenses</h1>
            <button class="btn btn-primary" onclick="openModal('shared-modal')"><i data-lucide="plus-circle"></i> Add Expense</button>
        </header>

        <div class="card" style="margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
            <input type="text" class="form-input" id="search-input" placeholder="Search expenses..." onkeyup="filterExpenses()" style="max-width: 300px;">
            <select class="form-input" id="filter-category" onchange="filterExpenses()" style="max-width: 200px;">
                <option value="">All Categories</option>
                <option value="Rent">🏠 Rent</option>
                <option value="Electricity">⚡ Electricity</option>
                <option value="Groceries">🛒 Groceries</option>
                <option value="Wi-Fi">🌐 Wi-Fi</option>
                <option value="Other">📦 Other</option>
            </select>
            <select class="form-input" id="filter-person" onchange="filterExpenses()" style="max-width: 200px;">
                <option value="">All People</option>
                <option value="user1" id="filter-p1-name">Person 1</option>
                <option value="user2" id="filter-p2-name">Person 2</option>
            </select>
        </div>

        <div class="card" style="padding: 0; overflow-x: auto;">
            <table class="responsive-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--border-color); text-align: left;">
                        <th style="padding: 16px;">Date</th>
                        <th style="padding: 16px;">Description</th>
                        <th style="padding: 16px;">Category</th>
                        <th style="padding: 16px;">Amount</th>
                        <th style="padding: 16px;">Paid By</th>
                        <th style="padding: 16px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="expenses-tbody"></tbody>
            </table>
            <div id="empty-state" class="empty-state-container" style="display: none;">
                <div class="empty-state-icon">🧾</div>
                <div class="empty-state-title">No shared expenses found</div>
                <p>Start tracking your flat expenses.</p>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="shared-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Add Shared Expense</h2>
                <button class="modal-close" onclick="closeModal('shared-modal')">&times;</button>
            </div>
            <form id="shared-form" onsubmit="handleAddShared(event)">
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <input type="text" class="form-input" name="description" required placeholder="e.g. Electricity Bill">
                </div>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-input" name="amount" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-input" name="date" required>
                    </div>
                </div>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select class="form-input" name="category" required>
                            <option value="Rent">🏠 Rent</option><option value="Electricity">⚡ Electricity</option>
                            <option value="Groceries">🛒 Groceries</option><option value="Wi-Fi">🌐 Wi-Fi</option><option value="Other">📦 Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Paid By</label>
                        <select class="form-input" name="paid_by" id="paid-by-select" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Split Type</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="split_type" value="equal" checked onchange="toggleCustomSplit()"> 50/50</label>
                        <label class="radio-label"><input type="radio" name="split_type" value="custom" onchange="toggleCustomSplit()"> Custom</label>
                    </div>
                </div>
                <div id="custom-split-fields" style="display: none;" class="grid grid-2">
                    <div class="form-group"><label class="form-label">My Share</label><input type="number" step="0.01" class="form-input" name="person1_share" placeholder="0.00"></div>
                    <div class="form-group"><label class="form-label">Roommate Share</label><input type="number" step="0.01" class="form-input" name="person2_share" placeholder="0.00"></div>
                </div>
                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('shared-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-shared">Add Expense</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/shared-expenses.js"></script>
</body>
</html>
