<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlatSplit - Reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="logo">🏠 Flat<span>Split</span></div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="./dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li class="nav-item"><a href="./shared-expenses.html" class="nav-link"><i data-lucide="receipt"></i> Shared Expenses</a></li>
            <li class="nav-item"><a href="./personal-expenses.html" class="nav-link"><i data-lucide="wallet"></i> My Expenses</a></li>
            <li class="nav-item"><a href="./balance.html" class="nav-link"><i data-lucide="scale"></i> Balance</a></li>
            <li class="nav-item"><a href="./analytics.html" class="nav-link"><i data-lucide="bar-chart-3"></i> Analytics</a></li>
            <li class="nav-item"><a href="./recurring.html" class="nav-link"><i data-lucide="repeat"></i> Recurring</a></li>
            <li class="nav-item"><a href="./reports.html" class="nav-link active"><i data-lucide="download"></i> Reports</a></li>
            <li class="nav-item"><a href="./settings.html" class="nav-link"><i data-lucide="settings"></i> Settings</a></li>
        </ul>
        <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <button onclick="logout()" class="nav-link" style="width:100%; background:none; border:none; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; gap:12px;"><i data-lucide="log-out"></i> Switch User</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="mobile-header" style="justify-content: space-between; margin-bottom: 24px;">
            <div class="logo" style="font-size: 20px;">🏠 Flat<span>Split</span></div>
            <button onclick="toggleSidebar()" style="background:none; border:none; font-size: 24px; cursor:pointer;">☰</button>
        </div>

        <header class="header"><h1>Export Reports</h1></header>

        <div class="card" style="margin-bottom: 24px;">
            <div class="grid grid-3" style="align-items: end;">
                <div class="form-group" style="margin:0">
                    <label class="form-label">Month</label>
                    <select class="form-input" id="report-month">
                        <option value="0">January</option><option value="1">February</option><option value="2">March</option>
                        <option value="3">April</option><option value="4">May</option><option value="5">June</option>
                        <option value="6">July</option><option value="7">August</option><option value="8" selected>September</option>
                        <option value="9">October</option><option value="10">November</option><option value="11">December</option>
                    </select>
                </div>
                <div class="form-group" style="margin:0">
                    <label class="form-label">Year</label>
                    <input type="number" class="form-input" id="report-year" value="2023">
                </div>
                <button class="btn btn-primary" onclick="generateReport()">Generate</button>
            </div>
        </div>

        <div id="report-output" style="display: none;">
            <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                <button class="btn btn-outline" onclick="exportCSV('shared')">↓ Export Shared CSV</button>
                <button class="btn btn-outline" onclick="exportCSV('personal')">↓ Export Personal CSV</button>
            </div>
            
            <h2 style="margin-bottom: 16px;">Shared Summary</h2>
            <div class="grid grid-4" style="margin-bottom: 32px;" id="shared-summary-cards"></div>

            <h2 style="margin-bottom: 16px;">Personal Summary</h2>
            <div class="grid grid-2" style="margin-bottom: 32px;" id="personal-summary-cards"></div>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/analytics.js"></script>
</body>
</html>
