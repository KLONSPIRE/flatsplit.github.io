<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlatSplit - Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="logo">🏠 Flat<span>Split</span></div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="./dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li class="nav-item"><a href="./shared-expenses.html" class="nav-link"><i data-lucide="receipt"></i> Shared Expenses</a></li>
            <li class="nav-item"><a href="./personal-expenses.html" class="nav-link"><i data-lucide="wallet"></i> My Expenses</a></li>
            <li class="nav-item"><a href="./balance.html" class="nav-link"><i data-lucide="scale"></i> Balance</a></li>
            <li class="nav-item"><a href="./analytics.html" class="nav-link active"><i data-lucide="bar-chart-3"></i> Analytics</a></li>
            <li class="nav-item"><a href="./recurring.html" class="nav-link"><i data-lucide="repeat"></i> Recurring</a></li>
            <li class="nav-item"><a href="./reports.html" class="nav-link"><i data-lucide="download"></i> Reports</a></li>
            <li class="nav-item"><a href="./settings.html" class="nav-link"><i data-lucide="settings"></i> Settings</a></li>
        </ul>
        <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <button onclick="logout()" class="nav-link" style="width:100%; background:none; border:none; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; gap:12px;"><i data-lucide="log-out"></i> Switch User</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="mobile-header" style="justify-content: space-between; margin-bottom: 24px;">
            <div class="logo" style="font-size: 20px;">🏠 Flat<span>Split</span></div>
            <button onclick="toggleSidebar()" style="background:none; border:none; font-size: 24px; cursor:pointer;">☰</button>
        </div>

        <header class="header">
            <div style="display: flex; gap: 16px;">
                <button class="btn btn-primary btn-analytics-tab" onclick="loadAnalytics('shared')">Shared</button>
                <button class="btn btn-outline btn-analytics-tab" onclick="loadAnalytics('personal')">Personal</button>
            </div>
        </header>

        <div class="grid grid-2">
            <div class="card">
                <h3 style="margin-bottom: 16px;">By Category</h3>
                <canvas id="catChart" height="250"></canvas>
            </div>
            <div class="card">
                <h3 style="margin-bottom: 16px;">Monthly Trend</h3>
                <canvas id="trendChart" height="250"></canvas>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/analytics.js"></script>
</body>
</html>
